; Laberint AF · Unreal Engine 5.8
; El juego arranca en el mapa vacío del motor: el modo de juego arma todo (laberinto, luces, niebla, jugador, bestias)
; con código, así el proyecto anda sin ningún archivo binario (.umap/.uasset) en el repositorio.
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/LaberintAF.LabModoJuego

; ---- gráficos realistas: Lumen (luz que rebota), Nanite (mallas de Megascans sin bajar detalle),
; sombras virtuales, niebla volumétrica y exposición fija (el juego es oscuro a propósito)
[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.AntiAliasingMethod=4
r.ReflectionCaptureResolution=256
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.Substrate=False
r.CustomDepth=3

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/LaberintAF")
NearClipPlane=10.0

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=False

[/Script/Engine.CollisionProfile]
; los enemigos no se traban entre ellos ni con la cámara
