<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laberint AF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: lienzo pixel a pantalla completa; HUD en tres zonas (estado izq., reloj centro, mapa y crónica der.); menús como cartas sobre la oscuridad */
:root{
  --void:#070807;
  --ink:#d9cfb6;
  --dim:#857d6a;
  --ember:#d08a44;
  --blood:#a8291f;
  --panel:#100e0b;
  --line:#3a342a;
  --font-display:"Bangers", Impact, "Arial Narrow", sans-serif;
  --font-body:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);overflow:hidden;margin:0;
  padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
/* estilo historieta (Borderlands): bordes de tinta gruesos, sombras duras y trama de puntos */
#stage{position:relative;width:100%;height:100%;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{display:block;background:var(--void);cursor:crosshair}
.lbl{color:var(--dim);font-family:var(--font-display);font-size:10px;letter-spacing:.1em;min-width:44px}
#hud{position:absolute;inset:0;pointer-events:none}
.hud-l{position:absolute;top:10px;left:max(16px, env(safe-area-inset-left, 0px));display:grid;gap:5px;font-size:13px;max-width:46vw}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.bar{width:84px;height:9px;background:#1a1712;display:block;border:2px solid #000;box-shadow:2px 2px 0 #000}
.bar i{display:block;height:100%;width:100%;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.35)}
.bar.hp i{background:var(--blood)} .bar.oil i{background:var(--ember)} .bar.st i{background:#8a8572}
#inv b{color:#e06a52;font-weight:600}
#ctLine{font-size:13px;color:var(--ink)}#ctLine b{color:#ffd040;font-weight:600}#ctLine.done b{color:#8fe07a}
#toast{position:absolute;top:46px;left:50%;transform:translateX(-50%);display:grid;gap:2px;text-align:center;background:#ffd23a;color:#140e06;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:8px 14px;pointer-events:none;max-width:min(420px,80vw);animation:introIn .4s ease-out}
#toast b{font-family:var(--font-display);font-size:20px;font-weight:400;letter-spacing:.04em}#toast span{font-size:14px}
#tip{position:absolute;top:136px;left:50%;transform:translateX(-50%);background:rgba(16,14,11,.92);color:var(--ink);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:8px 12px;font-size:16px;max-width:min(520px,86vw);text-align:center;pointer-events:none}
.swatches{display:flex;gap:6px;flex-wrap:wrap}.swatches button{width:30px;height:30px;border:3px solid #000;box-shadow:2px 2px 0 #000;cursor:pointer}.swatches button.on{outline:3px solid var(--ember);outline-offset:1px}
.end-moments{display:grid;gap:4px;font-size:16px;border-left:4px solid var(--ember);padding-left:10px}
#stl{font-family:var(--font-display);font-size:15px;letter-spacing:.05em;text-shadow:1px 1px 0 #000}#stl.ok{color:#8fe07a}#stl.sus{color:#ffd040}#stl.det{color:#ff5a3c}#stl.vis{color:var(--ink)}
#inv{color:var(--ink);font-variant-numeric:tabular-nums;flex-wrap:wrap;gap:4px 12px}
#keyLine,#huntLine{font-size:13px;color:var(--ink)}
#keyLine b{font-weight:600;color:var(--ember)} #huntLine b{font-weight:600;color:#e06a52}
#bossBar{position:absolute;top:98px;left:50%;transform:translateX(-50%);width:min(420px,70vw);display:grid;gap:3px;text-align:center;pointer-events:none}#bossBar b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.06em;color:#ffb040;text-shadow:2px 2px 0 #000}#bossBar i{display:block;height:12px;border:3px solid #000;box-shadow:3px 3px 0 #000;background:#1a0a08}#bossBar span{display:block;height:100%;background:linear-gradient(#e04030,#8a1410);transition:width .15s}
.lookrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}#lookCv{width:180px;height:180px;border:3px solid #000;box-shadow:4px 4px 0 #000;background:#16120c;flex:none}.lookopts{display:grid;gap:5px;flex:1;min-width:220px}.lookopts .swatches button{width:24px;height:24px}.look .seg button{font-size:14px;padding:3px 7px}
#timer{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:18px;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 2px 0 #000}
#timer.late{color:#e06a52}
.hud-r{position:absolute;top:10px;right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:6px;justify-items:end;width:min(240px,40vw)}
#fsBtn{pointer-events:auto;font-family:var(--font-display);font-size:10px;letter-spacing:.08em;background:rgba(16,14,11,.85);color:var(--ink);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:5px 8px;cursor:pointer}
#mm{width:128px;height:128px;image-rendering:pixelated;background:rgba(5,5,4,.75);border:2px solid #000;box-shadow:4px 4px 0 #000}
#feed{display:grid;gap:3px;font-size:12px;line-height:1.3;text-align:right;color:var(--ink);text-shadow:0 1px 0 #000}
#feed div{opacity:.95} #feed div.old{opacity:.5}
#prompt{position:absolute;bottom:118px;left:16px;right:16px;text-align:center;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;color:var(--ember);text-shadow:0 2px 0 #000;pointer-events:none}
#msg{position:absolute;bottom:88px;left:16px;right:16px;text-align:center;font-size:17px;color:var(--ink);text-shadow:0 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .4s}
#msg.show{opacity:1}
#tbtns{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));display:grid;grid-template-columns:repeat(3,58px);gap:8px}
#tbtns button,.tsmall{font-family:var(--font-display);font-size:10px;letter-spacing:.06em;height:52px;background:rgba(16,14,11,.78);color:var(--ink);border:3px solid #000;box-shadow:3px 3px 0 #000;touch-action:none}
#tbtns button.hot{border-color:var(--ember);color:var(--ember)}
#shop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.shopcard{pointer-events:auto;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),var(--panel);border:3px solid #000;box-shadow:8px 8px 0 #000;padding:16px;width:min(360px,calc(100vw - 32px));display:grid;gap:10px}
.shopcard h2{margin:0;font-family:var(--font-display);font-size:14px;letter-spacing:.12em;color:var(--ember)}
.shopcard p{margin:0;color:var(--dim);font-size:14px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:6px 0;border-top:1px solid #221e18}
.item small{color:var(--dim);font-size:13px;grid-column:1}
.item button{grid-row:1/3;grid-column:2;font-family:var(--font-display);font-size:11px;background:#1d1912;color:var(--ink);border:2px solid #000;box-shadow:2px 2px 0 #000;padding:8px 10px;cursor:pointer;min-width:64px}
.item button:disabled{opacity:.35;cursor:default}
.item button.sel{background:var(--ember);color:#120d07;border-color:var(--ember)}
.overlay{position:absolute;inset:0;display:flex;overflow:auto;background:radial-gradient(circle,rgba(0,0,0,.5) 1px,transparent 1.8px) 0 0/7px 7px,radial-gradient(ellipse at 50% 60%, rgba(60,38,18,.6), rgba(5,5,4,.96) 70%);padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.card{max-width:38rem;width:100%;display:grid;gap:16px;margin:auto}
.card h1{font-family:var(--font-display);font-weight:700;font-size:clamp(44px,11vw,84px);line-height:.9;margin:0;letter-spacing:.04em;text-shadow:4px 4px 0 var(--blood);text-wrap:balance}
.eyebrow{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--ember);margin:0}
.card p{margin:0;font-size:17px;line-height:1.45;max-width:62ch}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;color:var(--dim)}
.keys b{font-family:var(--font-display);font-weight:400;font-size:10px;color:var(--ink);letter-spacing:.06em;padding-top:3px}
.stash{display:grid;gap:4px;border:3px solid #000;box-shadow:6px 6px 0 #000;padding:12px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 6px),rgba(16,14,11,.86)}
.stash .gold{font-family:var(--font-display);color:var(--ember);font-size:14px;letter-spacing:.08em}
.results{display:grid;gap:2px;font-size:14px}
.results div{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:4px 0;border-top:1px solid #221e18}
.results .me{color:var(--ember)}
.results span:last-child{color:var(--dim);min-width:84px;text-align:right}
.btn{justify-self:start;font-family:var(--font-display);font-size:15px;letter-spacing:.1em;background:var(--ember);color:#120d07;border:0;padding:12px 18px;cursor:pointer;box-shadow:4px 4px 0 #3b1d0c}
.btn:hover{background:#e09a52}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #3b1d0c}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#intro{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 44px;background:radial-gradient(circle,rgba(0,0,0,.55) 1.2px,transparent 2px) 0 0/8px 8px,radial-gradient(ellipse at 50% 50%, rgba(110,18,10,.6), rgba(4,3,3,.97) 72%);padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));cursor:pointer;animation:introIn .7s ease-out}
#introCv{width:min(44vw,360px);max-width:100%;height:auto;filter:drop-shadow(0 0 22px rgba(200,40,20,.5));animation:breathe 1.8s ease-in-out infinite}
.intro-txt{max-width:30rem;display:grid;gap:12px;min-width:0}
.intro-txt h2{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vw,58px);line-height:1;margin:0;color:var(--ink);text-shadow:3px 3px 0 var(--blood);text-wrap:balance}
.intro-txt p{margin:0;font-size:18px;line-height:1.4}
.intro-hint{color:var(--ember);font-family:var(--font-display);font-size:11px!important;letter-spacing:.14em}
@keyframes introIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes breathe{50%{transform:translateY(-5px) scale(1.02)}}
@media (prefers-reduced-motion: reduce){#intro,#introCv{animation:none}}
/* barra de armas, cinturón e inventario (TAB) */
#bars{position:absolute;left:50%;bottom:max(12px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;gap:14px;align-items:flex-end;pointer-events:none}
.slots{display:flex;gap:6px}
.slot{pointer-events:auto;position:relative;width:52px;height:52px;padding:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),rgba(16,14,11,.82);border:3px solid #000;box-shadow:3px 3px 0 #000,inset 0 0 0 2px var(--rc,#3a342a);cursor:pointer;color:var(--ink);font-family:var(--font-display);touch-action:none}
.slot img{width:100%;height:100%;display:block;image-rendering:auto}
.slot b{position:absolute;left:3px;top:1px;font-size:13px;font-weight:400;color:#fff;-webkit-text-stroke:.5px #000;text-shadow:1px 1px 0 #000}
.slot small{position:absolute;right:3px;bottom:1px;font-size:13px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;-webkit-text-stroke:.4px #000}
.slot.on{transform:translateY(-6px);box-shadow:3px 9px 0 #000,inset 0 0 0 2px var(--rc,var(--ember)),0 0 0 3px var(--ember)}
.slot.empty{opacity:.55}
.slot.none img{opacity:.3;filter:grayscale(1)}
.slot.sel{outline:3px dashed #fff;outline-offset:2px}
.slot i.dur{position:absolute;left:3px;bottom:2px;height:3px;border:1px solid #000;box-sizing:content-box;max-width:calc(100% - 8px)}
.bar-lbl{position:absolute;top:-21px;white-space:nowrap;left:0;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;color:var(--dim);text-shadow:1px 1px 0 #000}
.slots.wrap{position:relative}
#invBtn,#fsBtn,#pauseBtn{white-space:nowrap}
#pauseBtn{pointer-events:auto;font-family:var(--font-display);font-size:15px;letter-spacing:.06em;background:rgba(16,14,11,.85);color:var(--ink);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:5px 8px;cursor:pointer}
#pause{z-index:5}.opts{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;border:3px solid #000;box-shadow:6px 6px 0 #000;padding:14px;background:rgba(16,14,11,.86)}
.opts label{font-family:var(--font-display);font-size:17px;letter-spacing:.05em}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{font-family:var(--font-display);font-size:16px;background:#1d1912;color:var(--ink);border:2px solid #000;box-shadow:2px 2px 0 #000;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--ember);color:#120d07}.opts input[type=range]{width:100%;accent-color:var(--ember)}.prow{display:flex;gap:12px;flex-wrap:wrap}
#invBtn{pointer-events:auto;font-family:var(--font-display);font-size:15px;letter-spacing:.06em;background:var(--ember);color:#120d07;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:5px 8px;cursor:pointer}
#invp{position:absolute;inset:0;display:flex;background:radial-gradient(circle,rgba(0,0,0,.45) 1px,transparent 1.8px) 0 0/7px 7px,rgba(4,3,3,.62);padding:16px;overflow:auto}
.invcard{margin:auto;box-sizing:border-box;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),var(--panel);border:4px solid #000;box-shadow:10px 10px 0 #000;padding:16px 18px;width:min(980px,100%);display:grid;gap:12px}
.invhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.invhead h2{margin:0;font-family:var(--font-display);font-size:38px;letter-spacing:.04em;color:var(--ink);-webkit-text-stroke:1.5px #000;text-shadow:3px 3px 0 var(--blood),5px 5px 0 #000}
.invhead span{color:var(--dim);font-size:15px;flex:1;min-width:180px}
.invgrid{display:grid;grid-template-columns:auto auto minmax(240px,1fr);gap:16px 22px;align-items:start}
.invgrid h3{margin:8px 0 6px;font-family:var(--font-display);font-weight:400;font-size:17px;letter-spacing:.08em;color:var(--ember)}
.invgrid h3:first-child{margin-top:0}
.bag{display:grid;grid-template-columns:repeat(4,52px);gap:6px}
.inv-stats{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:15px;margin-top:8px}
.inv-stats span:nth-child(odd){color:var(--dim)}
.icard{border:3px solid #000;box-shadow:6px 6px 0 #000;background:#16130f;display:grid;gap:8px;padding:0 0 12px}
.icard .ihead{background:var(--rc,#4a4436);color:#100c08;padding:8px 12px;font-family:var(--font-display);font-size:24px;letter-spacing:.03em;line-height:1.05;border-bottom:3px solid #000}
.icard .ihead small{display:block;font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:0;opacity:.85}
.icard .ibody{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:0 12px;align-items:center}
.icard img{width:72px;height:72px;background:#0c0a08;border:2px solid #000}
.istats{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-size:15px}
.istats b{font-family:var(--font-display);font-weight:400;font-size:18px;text-align:right}
.istats i{font-style:normal;font-size:13px;min-width:44px;text-align:right}
.istats .up{color:#7fe07a}.istats .dn{color:#ff6a50}
.icard p{margin:0 12px;color:var(--ink);font-size:15px}
.iacts{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px}
.iacts button,#invClose{font-family:var(--font-display);font-size:16px;letter-spacing:.05em;background:#1d1912;color:var(--ink);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:7px 12px;cursor:pointer}
.iacts button.main{background:var(--ember);color:#120d07}
.inv-hint{color:var(--dim);font-size:15px;line-height:1.4}
@media (max-width:900px){.invgrid{grid-template-columns:auto 1fr}.invgrid>section:last-child{grid-column:1/-1}}
@media (max-width:560px){.invgrid{grid-template-columns:1fr}}
@media (max-width:620px){#invBtn,#fsBtn,#pauseBtn{font-size:12px!important;padding:4px 6px}}
@media (max-width:760px){.slot{width:44px;height:44px}.bag{grid-template-columns:repeat(6,44px)}#bars{gap:8px}.invhead h2{font-size:30px}}
@media (max-width:620px){#bars{flex-direction:column;align-items:center;gap:20px}.slot{width:40px;height:40px}}
@media (pointer:coarse){#bars .slot{width:38px;height:38px}#bars .slot b,#bars .slot small{font-size:11px}#bars{left:calc((100% - 214px)/2);gap:10px}#tbtns button{font-size:12px!important;letter-spacing:0!important}}
@media (pointer:coarse) and (max-width:620px){#bars{left:50%;bottom:150px}#prompt{bottom:268px}#msg{bottom:240px}}
#event{position:absolute;top:20%;left:16px;right:16px;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#event.show{opacity:1}
.ev-t{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,48px);line-height:1;color:var(--ink);text-shadow:3px 3px 0 var(--blood);letter-spacing:.04em;text-wrap:balance}
.ev-d{font-size:17px;color:var(--ink);text-shadow:0 2px 0 #000;margin-top:8px}
@media (max-width:620px){#prompt{bottom:150px}#msg{bottom:124px}#feed{display:none} #mm{width:88px;height:88px} .hud-l{font-size:12px} .bar{width:60px}}
@media (prefers-reduced-motion: reduce){#msg{transition:none}}
/* estilo cómic */
.lbl{font-size:13px;letter-spacing:.06em}
#timer{font-size:30px;letter-spacing:.04em;-webkit-text-stroke:1px #000}
.eyebrow{font-size:15px;letter-spacing:.12em}
.card h1{font-size:clamp(60px,14vw,124px);letter-spacing:.02em;text-shadow:5px 5px 0 var(--blood),8px 8px 0 #000;-webkit-text-stroke:2px #000}
.card p{font-size:19px}
#prompt{font-size:20px;letter-spacing:.05em;-webkit-text-stroke:.6px #000}
#tbtns button{font-size:16px;letter-spacing:.04em}
.shopcard h2{font-size:26px}
.item button{font-size:16px}
.btn{font-size:24px;letter-spacing:.06em;border:3px solid #000}
.keys b{font-size:16px;letter-spacing:.04em}
.stash .gold{font-size:22px}
#fsBtn{font-size:15px}
.ev-t{-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 var(--blood),7px 7px 0 #000}
.intro-txt h2{-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 var(--blood),7px 7px 0 #000}
.intro-hint{font-size:15px!important}
#msg{font-size:19px;font-weight:600}
</style>
</head>
<body>

<div id="stage">
  <canvas id="c" aria-label="Juego Laberint AF"></canvas>
  <div id="hud" hidden>
    <div class="hud-l">
      <div class="row"><span class="lbl">VIDA</span><span class="bar hp"><i id="hpB"></i></span></div>
      <div class="row"><span class="lbl">LUZ</span><span class="bar oil"><i id="oilB"></i></span></div>
      <div class="row"><span class="lbl">AIRE</span><span class="bar st"><i id="stB"></i></span></div>
      <div class="row"><span class="lbl">SIGILO</span><span id="stl"></span></div>
      <div class="row" id="inv"></div>
      <div class="row" id="huntLine"></div>
      <div class="row" id="ctLine"></div>
      <div class="row" id="keyLine"></div>
    </div>
    <div id="bossBar" hidden><b id="bossN"></b><i><span id="bossF"></span></i></div>
    <div id="timer">15:00</div>
    <div id="bars"><div class="slots wrap" id="wbar"></div><div class="slots wrap" id="belt"></div></div>
    <div class="hud-r"><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button type="button" id="pauseBtn">PAUSA</button><button type="button" id="invBtn">MOCHILA · TAB</button><button type="button" id="fsBtn">PANTALLA COMPLETA</button></div><canvas id="mm" width="128" height="128"></canvas><div id="feed"></div></div>
  </div>
  <div id="event"><div class="ev-t" id="evT"></div><div class="ev-d" id="evD"></div></div>
  <div id="prompt"></div>
  <div id="toast" hidden></div><div id="tip" hidden></div>
  <div id="msg"></div>
  <div id="tbtns" hidden>
    <button type="button" id="bAtk">ATACAR</button>

    if(hatch.open>0){
      if(dd<24&&p.keys.has(p.id)){const comp=players.filter(q=>q!==p&&q.alive&&!q.escaped&&p.keys.has(q.id)&&dist(p,q)<56).map(q=>q.name);txt='E · Escapar'+(comp.length?` con ${comp.join(', ')}`:'')+` · se cierra en ${Math.ceil(hatch.open)}s`;promptAct=()=>extract(p)}

    }else if(p.keys.has(p.id)){txt='E · Abrir la escotilla (hay que aguantar 10 s)';promptAct=()=>startHatch(p)}

  }else{
    const it=drops.find(d=>d.type==='item'&&d.def.slot!=='ammo'&&d.def.slot!=='throw'&&dist(p,d)<14);
    const m=npcs.find(n=>n.type==='merchant'&&dist(p,n)<26);

function endMatch(win,reason){

  screen.hidden=false;hudEl.hidden=true;tbtns.hidden=true;promptEl.textContent='';msgEl.classList.remove('show');

  $('copyBtn').addEventListener('click',()=>{const done=()=>{$('copyBtn').textContent='COPIADO'};const fb=()=>{const t=$('sumTxt');t.hidden=false;t.value=sum;t.select();done()};try{navigator.clipboard.writeText(sum).then(done,fb)}catch(e){fb()}});
}

function resize(){
  const w=stage.clientWidth||innerWidth,h=stage.clientHeight||innerHeight,dpr=Math.min(isTouch?1.15:1.5,window.devicePixelRatio||1);
  VH=140;VW=clamp(VH*w/h,140,306);const cssH=Math.min(h,w*VH/VW),cssW=cssH*VW/VH;
  H=Math.max(300,Math.min(820,Math.round(cssH*dpr)));const nS=H/VH;W=Math.round(VW*nS);
  if(Math.abs(nS-S)>.01){chunkCache.clear();bushCache.clear()}S=nS;
  cv.width=W;cv.height=H;lightCv.width=Math.max(1,W>>1);lightCv.height=Math.max(1,H>>1);
  cv.style.width=Math.floor(cssW)+'px';cv.style.height=Math.floor(cssH)+'px';
